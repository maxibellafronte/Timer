<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MIX WOD · Temporizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d;
    --bg-raised:#141419;
    --bg-raised2:#1c1c22;
    --amrap:#e0954a;
    --fortime:#5468f0;
    --emom:#9014d9;
    --tabata:#4fbf8d;
    --rest:#4a4e58;
    --text:#f5f5f7;
    --text-dim:#9a9aa5;
    --line:#26262e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    overscroll-behavior:none; user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .clock-font{font-family:'Bebas Neue',sans-serif;}

  /* ---------- SCREENS ---------- */
  .screen{display:none; min-height:100vh; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- BUILDER ---------- */
  #builder{padding:22px 18px 100px;}
  .top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;}
  .top h1{font-family:'Bebas Neue',sans-serif; font-size:38px; letter-spacing:1px; margin:0;}
  .top .sub{color:var(--text-dim); font-size:13px;}
  .total-row{display:flex; align-items:center; gap:8px; margin:14px 0 20px; color:var(--text-dim); font-size:14px;}
  .total-row b{color:var(--text); font-size:16px;}

  .block-list{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
  .block-card{
    border-radius:20px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    color:#0a0a0d; font-weight:700;
  }
  .block-card .info{display:flex; flex-direction:column; gap:2px;}
  .block-card .type{font-size:17px; letter-spacing:0.3px;}
  .block-card .detail{font-size:12.5px; font-weight:600; opacity:0.75;}
  .block-card .ctrls{display:flex; gap:6px;}
  .block-card button{
    border:none; background:rgba(10,10,13,0.18); color:#0a0a0d; width:30px; height:30px;
    border-radius:9px; font-size:15px; font-weight:800; cursor:pointer; line-height:1;
  }
  .block-card button:active{background:rgba(10,10,13,0.32);}

  .empty-hint{color:var(--text-dim); font-size:14px; text-align:center; padding:30px 10px; border:1.5px dashed var(--line); border-radius:16px;}

  .add-title{font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; margin:8px 0 10px;}
  .add-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .add-btn{
    border:none; border-radius:16px; padding:16px 10px; font-family:'Space Grotesk'; font-weight:700; font-size:15px;
    color:#0a0a0d; cursor:pointer; letter-spacing:0.3px;
  }
  .add-btn.rest{color:var(--text); }

  .start-bar{
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--bg) 60%, transparent); display:flex; gap:10px;
  }
  .btn-primary{
    flex:1; background:var(--text); color:#0a0a0d; border:none; border-radius:16px; padding:16px;
    font-family:'Bebas Neue'; font-size:22px; letter-spacing:1px; cursor:pointer;
  }
  .btn-primary:disabled{opacity:0.3;}
  .btn-ghost{
    background:var(--bg-raised2); color:var(--text); border:none; border-radius:16px; padding:16px 18px;
    font-family:'Space Grotesk'; font-weight:600; font-size:14px; cursor:pointer;
  }

  /* saved workouts */
  .saved-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px;}
  .saved-chip{
    flex:0 0 auto; background:var(--bg-raised); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:100px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer;
  }

  /* ---------- MODAL (config) ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; z-index:50;
  }
  .modal-bg.active{display:flex;}
  .modal{
    background:var(--bg-raised); width:100%; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
  }
  .modal h2{font-family:'Bebas Neue'; font-size:26px; margin:0 0 4px; letter-spacing:0.5px;}
  .modal .modal-sub{color:var(--text-dim); font-size:13px; margin-bottom:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;}
  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{
    width:44px; height:44px; border-radius:12px; border:none; background:var(--bg-raised2); color:var(--text);
    font-size:20px; font-weight:700; cursor:pointer;
  }
  .stepper .val{font-family:'Bebas Neue'; font-size:26px; min-width:90px; text-align:center;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; background:var(--bg-raised2); padding:12px 14px; border-radius:14px; margin-bottom:10px;}
  .toggle-row span{font-size:14px; font-weight:600;}
  .switch{position:relative; width:46px; height:26px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:#33333c; border-radius:100px; transition:0.2s; cursor:pointer;}
  .slider:before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:0.2s;}
  .switch input:checked + .slider{background:var(--emom);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .sub-fields{display:none; gap:10px;}
  .sub-fields.active{display:flex;}
  .modal-btns{display:flex; gap:10px; margin-top:6px;}

  /* ---------- PLAYER ---------- */
  #player{background:var(--bg); position:relative;}
  .player-top{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 0;}
  .player-top .exit{background:none; border:none; color:var(--text-dim); font-size:14px; font-weight:600; cursor:pointer;}
  .progress-track{height:5px; background:var(--bg-raised2); border-radius:10px; margin:14px 20px 0; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:var(--text); border-radius:10px; transition:width 0.3s linear;}

  .player-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 24px 20px; text-align:center;}
  .phase-pill{
    padding:10px 22px; border-radius:100px; font-family:'Bebas Neue'; font-size:20px; letter-spacing:1.5px; color:#0a0a0d; margin-bottom:6px;
  }
  .round-info{color:var(--text-dim); font-size:14px; font-weight:600; margin-bottom:18px; min-height:18px;}
  .big-clock{font-family:'Bebas Neue'; font-size:min(40vw,220px); line-height:0.9; letter-spacing:2px; font-variant-numeric:tabular-nums;}
  .next-up{color:var(--text-dim); font-size:13px; margin-top:22px;}
  .next-up b{color:var(--text);}

  .player-controls{display:flex; gap:12px; padding:0 20px calc(24px + env(safe-area-inset-bottom));}
  .ctrl-btn{
    flex:1; border:none; border-radius:18px; padding:18px 10px; font-family:'Bebas Neue'; font-size:20px;
    letter-spacing:1px; cursor:pointer; background:var(--bg-raised2); color:var(--text);
  }
  .ctrl-btn.main{background:var(--text); color:#0a0a0d;}
  .ctrl-btn.skip{flex:0 0 74px;}

  /* ---------- LANDSCAPE GYM-CLOCK MODE ---------- */
  @media (orientation:landscape){
    #player.active{ padding:0; }
    #player .player-top, #player .progress-track, #player .next-up, #player .round-info, #player .phase-pill{display:none;}
    #player .player-body{padding:0;}
    #player .big-clock{
      font-size:min(48vw,60vh); letter-spacing:4px; color:#0a0a0d;
      text-shadow:0 0 0 #0a0a0d;
    }
    #player .player-controls{
      position:fixed; bottom:0; left:0; right:0; padding:0; opacity:0; pointer-events:none; transition:opacity 0.25s;
    }
    #player.show-ctrls .player-controls{opacity:1; pointer-events:auto; padding:16px 20px;}
    #player.show-ctrls .ctrl-btn{background:rgba(10,10,13,0.35); color:#fff; backdrop-filter:blur(6px);}
    #player.show-ctrls .ctrl-btn.main{background:rgba(10,10,13,0.55); color:#fff;}
  }

  /* done screen */
  .done-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;}
  .done-wrap h1{font-family:'Bebas Neue'; font-size:52px; margin:0 0 10px;}
  .done-wrap p{color:var(--text-dim); margin:0 0 30px;}
</style>
</head>
<body>

<!-- ============ BUILDER SCREEN ============ -->
<div id="builder" class="screen active">
  <div class="top">
    <div>
      <h1>MIX WOD</h1>
      <div class="sub">Arma tu temporizador mezclado</div>
    </div>
  </div>

  <div id="savedRow" class="saved-row"></div>

  <div class="total-row">Duración total: <b id="totalTime">00:00</b></div>

  <div id="blockList" class="block-list"></div>
  <div id="emptyHint" class="empty-hint">Todavía no agregaste bloques.<br>Elegí un tipo abajo para empezar.</div>

  <div class="add-title">Agregar bloque</div>
  <div class="add-grid">
    <button class="add-btn" style="background:var(--amrap)" onclick="openConfig('AMRAP')">AMRAP</button>
    <button class="add-btn" style="background:var(--fortime)" onclick="openConfig('FORTIME')">FOR TIME</button>
    <button class="add-btn" style="background:var(--emom)" onclick="openConfig('EMOM')">EMOM</button>
    <button class="add-btn" style="background:var(--tabata)" onclick="openConfig('TABATA')">TABATA</button>
    <button class="add-btn rest" style="background:var(--rest)" onclick="openConfig('REST')">DESCANSO</button>
    <button class="add-btn" style="background:var(--bg-raised2); color:var(--text)" onclick="saveWorkout()">💾 GUARDAR</button>
  </div>

  <div class="start-bar">
    <button class="btn-ghost" onclick="clearAll()">Vaciar</button>
    <button class="btn-primary" id="startBtn" disabled onclick="startWorkout()">EMPEZAR</button>
  </div>
</div>

<!-- ============ CONFIG MODAL ============ -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">AMRAP</h2>
    <div class="modal-sub" id="modalSub">Configurá el bloque</div>

    <div class="field" id="fieldDuration">
      <label id="durationLabel">Duración (min : seg)</label>
      <div class="stepper">
        <button onclick="stepVal('durMin',-1,0,180)">−</button>
        <div class="val"><span id="durMin">5</span> min</div>
        <button onclick="stepVal('durMin',1,0,180)">+</button>
        <button onclick="stepVal('durSec',-5,0,55)">−</button>
        <div class="val"><span id="durSec">0</span> seg</div>
        <button onclick="stepVal('durSec',5,0,55)">+</button>
      </div>
    </div>

    <!-- EMOM custom work/rest -->
    <div class="field" id="fieldEmomToggle">
      <div class="toggle-row">
        <span>Dividir cada minuto en trabajo/descanso</span>
        <label class="switch"><input type="checkbox" id="emomSplitToggle" onchange="toggleEmomSplit()"><span class="slider"></span></label>
      </div>
      <div class="sub-fields" id="emomSubFields">
        <div class="field" style="flex:1">
          <label>Trabajo (seg)</label>
          <div class="stepper"><button onclick="stepVal('emomWork',-5,5,59)">−</button><div class="val"><span id="emomWork">45</span>s</div><button onclick="stepVal('emomWork',5,5,59)">+</button></div>
        </div>
        <div class="field" style="flex:1">
          <label>Descanso (seg)</label>
          <div class="stepper"><button onclick="stepVal('emomRest',-5,0,55)">−</button><div class="val"><span id="emomRest">15</span>s</div><button onclick="stepVal('emomRest',5,0,55)">+</button></div>
        </div>
      </div>
    </div>

    <!-- TABATA fields -->
    <div class="field" id="fieldTabataWork">
      <label>Trabajo (seg)</label>
      <div class="stepper"><button onclick="stepVal('tabWork',-5,5,120)">−</button><div class="val"><span id="tabWork">20</span>s</div><button onclick="stepVal('tabWork',5,5,120)">+</button></div>
    </div>
    <div class="field" id="fieldTabataRest">
      <label>Descanso (seg)</label>
      <div class="stepper"><button onclick="stepVal('tabRest',-5,0,120)">−</button><div class="val"><span id="tabRest">10</span>s</div><button onclick="stepVal('tabRest',5,0,120)">+</button></div>
    </div>
    <div class="field" id="fieldTabataRounds">
      <label>Rondas</label>
      <div class="stepper"><button onclick="stepVal('tabRounds',-1,1,50)">−</button><div class="val"><span id="tabRounds">8</span></div><button onclick="stepVal('tabRounds',1,1,50)">+</button></div>
    </div>

    <div class="modal-btns">
      <button class="btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="confirmAddBlock()">AGREGAR</button>
    </div>
  </div>
</div>

<!-- ============ PLAYER SCREEN ============ -->
<div id="player" class="screen">
  <div class="player-top">
    <button class="exit" onclick="exitPlayer()">✕ Salir</button>
    <div class="round-info" id="workoutName" style="margin:0;"></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="player-body" onclick="toggleLandscapeCtrls()">
    <div class="phase-pill" id="phasePill">AMRAP</div>
    <div class="round-info" id="roundInfo"></div>
    <div class="big-clock clock-font" id="bigClock">05:00</div>
    <div class="next-up" id="nextUp"></div>
  </div>

  <div class="player-controls">
    <button class="ctrl-btn skip" onclick="skipBack()">⏮</button>
    <button class="ctrl-btn main" id="pauseBtn" onclick="togglePause()">PAUSAR</button>
    <button class="ctrl-btn skip" onclick="skipFwd()">⏭</button>
  </div>
</div>

<!-- ============ DONE SCREEN ============ -->
<div id="done" class="screen">
  <div class="done-wrap">
    <h1>💥 WOD COMPLETO</h1>
    <p id="doneSummary">Buen trabajo.</p>
    <button class="btn-primary" style="width:100%" onclick="backToBuilder()">VOLVER</button>
  </div>
</div>

<script>
/* ================= DATA ================= */
const COLORS = { AMRAP:'#e0954a', FORTIME:'#5468f0', EMOM:'#9014d9', TABATA:'#4fbf8d', REST:'#4a4e58' };
const NAMES  = { AMRAP:'AMRAP', FORTIME:'FOR TIME', EMOM:'EMOM', TABATA:'TABATA', REST:'DESCANSO' };
let blocks = [];       // list of configured blocks (builder)
let editingType = null;

/* ---------- helpers ---------- */
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function stepVal(id, delta, min, max){
  const el = document.getElementById(id);
  let v = parseInt(el.textContent) + delta;
  v = Math.max(min, Math.min(max, v));
  el.textContent = v;
}
function toggleEmomSplit(){
  document.getElementById('emomSubFields').classList.toggle('active', document.getElementById('emomSplitToggle').checked);
}

/* ---------- modal open/close ---------- */
function openConfig(type){
  editingType = type;
  document.getElementById('modalTitle').textContent = NAMES[type];
  document.getElementById('fieldDuration').style.display = (type==='TABATA') ? 'none' : 'block';
  document.getElementById('fieldEmomToggle').style.display = type==='EMOM' ? 'block' : 'none';
  document.getElementById('fieldTabataWork').style.display = type==='TABATA' ? 'block' : 'none';
  document.getElementById('fieldTabataRest').style.display = type==='TABATA' ? 'block' : 'none';
  document.getElementById('fieldTabataRounds').style.display = type==='TABATA' ? 'block' : 'none';

  document.getElementById('durationLabel').textContent =
    type==='EMOM' ? 'Duración total EMOM (min : seg)' :
    type==='REST' ? 'Descanso (min : seg)' : 'Duración (min : seg)';

  document.getElementById('modalSub').textContent =
    type==='AMRAP' ? 'Máximas rondas posibles en el tiempo' :
    type==='FORTIME' ? 'Cuenta regresiva con tope de tiempo' :
    type==='EMOM' ? 'Cada minuto empieza un nuevo trabajo' :
    type==='TABATA' ? 'Intervalos cortos de trabajo/descanso' : 'Pausa entre bloques';

  if(type==='EMOM'){
    document.getElementById('durMin').textContent = 8;
    document.getElementById('durSec').textContent = 0;
    document.getElementById('emomSplitToggle').checked = false;
    toggleEmomSplit();
  } else if(type==='TABATA'){
    // no total duration field shown, uses work/rest/rounds
  } else if(type==='REST'){
    document.getElementById('durMin').textContent = 1;
    document.getElementById('durSec').textContent = 0;
  } else {
    document.getElementById('durMin').textContent = type==='AMRAP' ? 12 : 20;
    document.getElementById('durSec').textContent = 0;
  }
  document.getElementById('modalBg').classList.add('active');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }

function confirmAddBlock(){
  const type = editingType;
  const durMin = parseInt(document.getElementById('durMin').textContent);
  const durSec = parseInt(document.getElementById('durSec').textContent);
  let block = { id: Date.now()+Math.random(), type, color: COLORS[type] };

  if(type==='AMRAP' || type==='FORTIME' || type==='REST'){
    block.duration = durMin*60 + durSec;
    if(block.duration <= 0){ closeModal(); return; }
  }
  if(type==='EMOM'){
    const totalSec = durMin*60 + durSec;
    const split = document.getElementById('emomSplitToggle').checked;
    const work = split ? parseInt(document.getElementById('emomWork').textContent) : 60;
    const rest = split ? parseInt(document.getElementById('emomRest').textContent) : 0;
    const cycle = work + rest;
    if(totalSec <= 0 || cycle <= 0){ closeModal(); return; }
    const rounds = Math.max(1, Math.round(totalSec / cycle));
    block.work = work; block.rest = rest; block.rounds = rounds;
    block.duration = rounds * cycle;
  }
  if(type==='TABATA'){
    const work = parseInt(document.getElementById('tabWork').textContent);
    const rest = parseInt(document.getElementById('tabRest').textContent);
    const rounds = parseInt(document.getElementById('tabRounds').textContent);
    block.work = work; block.rest = rest; block.rounds = rounds;
    block.duration = rounds * (work + rest);
  }
  blocks.push(block);
  renderBlocks();
  closeModal();
}

/* ---------- builder render ---------- */
function detailText(b){
  if(b.type==='EMOM') return b.rest>0 ? `${b.rounds} min · ${b.work}s trabajo / ${b.rest}s desc` : `${b.rounds} min continuos`;
  if(b.type==='TABATA') return `${b.rounds}x — ${b.work}s / ${b.rest}s`;
  return fmt(b.duration);
}
function renderBlocks(){
  const list = document.getElementById('blockList');
  list.innerHTML = '';
  blocks.forEach((b, i)=>{
    const div = document.createElement('div');
    div.className = 'block-card';
    div.style.background = b.color;
    div.innerHTML = `
      <div class="info">
        <div class="type">${NAMES[b.type]}</div>
        <div class="detail">${detailText(b)}</div>
      </div>
      <div class="ctrls">
        <button onclick="moveBlock(${i},-1)">↑</button>
        <button onclick="moveBlock(${i},1)">↓</button>
        <button onclick="removeBlock(${i})">✕</button>
      </div>`;
    list.appendChild(div);
  });
  document.getElementById('emptyHint').style.display = blocks.length ? 'none' : 'block';
  document.getElementById('startBtn').disabled = blocks.length === 0;
  const total = blocks.reduce((a,b)=>a+b.duration,0);
  document.getElementById('totalTime').textContent = fmt(total);
}
function moveBlock(i, dir){
  const j = i+dir;
  if(j<0 || j>=blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  renderBlocks();
}
function removeBlock(i){ blocks.splice(i,1); renderBlocks(); }
function clearAll(){ if(blocks.length && !confirm('¿Vaciar todos los bloques?')) return; blocks = []; renderBlocks(); }

/* ---------- save / load workouts (localStorage) ---------- */
function getSaved(){ try{ return JSON.parse(localStorage.getItem('mixwod_saved')||'[]'); }catch(e){ return []; } }
function renderSaved(){
  const row = document.getElementById('savedRow');
  const saved = getSaved();
  row.innerHTML = '';
  saved.forEach((w, i)=>{
    const chip = document.createElement('div');
    chip.className = 'saved-chip';
    chip.textContent = w.name;
    chip.onclick = ()=>{ blocks = JSON.parse(JSON.stringify(w.blocks)); renderBlocks(); };
    chip.oncontextmenu = (e)=>{ e.preventDefault(); if(confirm('¿Borrar "'+w.name+'"?')){ const s=getSaved(); s.splice(i,1); localStorage.setItem('mixwod_saved', JSON.stringify(s)); renderSaved(); } };
    row.appendChild(chip);
  });
}
function saveWorkout(){
  if(!blocks.length){ alert('Agregá al menos un bloque primero.'); return; }
  const name = prompt('Nombre del WOD:');
  if(!name) return;
  const saved = getSaved();
  saved.push({name, blocks: JSON.parse(JSON.stringify(blocks))});
  localStorage.setItem('mixwod_saved', JSON.stringify(saved));
  renderSaved();
}
renderSaved();
renderBlocks();

/* ================= AUDIO (beeps, no files needed) ================= */
let actx;
function beep(freq=880, dur=0.12, vol=0.35){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

/* ================= PLAYER ENGINE ================= */
let segments = [];   // flattened list of {type, phase, label, color, duration, round, totalRounds}
let segIndex = 0;
let remaining = 0;
let timerHandle = null;
let paused = false;
let lastBeepSec = null;

function buildSegments(){
  const segs = [];
  blocks.forEach(b=>{
    if(b.type==='AMRAP'){
      segs.push({type:'AMRAP', label:'AMRAP', color:b.color, duration:b.duration, roundInfo:''});
    } else if(b.type==='FORTIME'){
      segs.push({type:'FORTIME', label:'FOR TIME', color:b.color, duration:b.duration, roundInfo:'Tope de tiempo'});
    } else if(b.type==='REST'){
      segs.push({type:'REST', label:'DESCANSO', color:b.color, duration:b.duration, roundInfo:''});
    } else if(b.type==='EMOM'){
      for(let r=1;r<=b.rounds;r++){
        segs.push({type:'EMOM', label:'EMOM', color:b.color, duration:b.work, roundInfo:`Min ${r} / ${b.rounds} · Trabajo`});
        if(b.rest>0) segs.push({type:'EMOM_REST', label:'DESCANSO', color:'var(--rest)', colorHex:'#4a4e58', duration:b.rest, roundInfo:`Min ${r} / ${b.rounds} · Descanso`});
      }
    } else if(b.type==='TABATA'){
      for(let r=1;r<=b.rounds;r++){
        segs.push({type:'TABATA', label:'TABATA', color:b.color, duration:b.work, roundInfo:`Ronda ${r} / ${b.rounds} · Trabajo`});
        segs.push({type:'TABATA_REST', label:'DESCANSO', color:'#4a4e58', duration:b.rest, roundInfo:`Ronda ${r} / ${b.rounds} · Descanso`});
      }
    }
  });
  return segs.filter(s=>s.duration>0);
}

function startWorkout(){
  segments = buildSegments();
  if(!segments.length) return;
  segIndex = 0;
  showScreen('player');
  document.getElementById('workoutName').textContent = blocks.length+' bloques · '+fmt(blocks.reduce((a,b)=>a+b.duration,0));
  loadSegment(0);
  paused = false;
  document.getElementById('pauseBtn').textContent = 'PAUSAR';
  runTimer();
}
function loadSegment(i){
  const s = segments[i];
  remaining = s.duration;
  lastBeepSec = null;
  const pill = document.getElementById('phasePill');
  pill.textContent = s.label;
  pill.style.background = s.colorHex || s.color;
  document.getElementById('roundInfo').textContent = s.roundInfo || '';
  document.getElementById('bigClock').textContent = fmt(remaining);
  document.getElementById('bigClock').style.color = '#f5f5f7';
  const next = segments[i+1];
  document.getElementById('nextUp').innerHTML = next ? `Siguiente: <b>${next.label}</b> ${next.roundInfo?('· '+next.roundInfo):''}` : 'Último bloque';
  updateProgress();
  vibrate(60);
  beep(660,0.15);
  applyLandscapeBg(s.colorHex || s.color);
}
function applyLandscapeBg(color){
  document.getElementById('player').style.background = window.matchMedia('(orientation: landscape)').matches ? color : 'var(--bg)';
  document.body.style.background = window.matchMedia('(orientation: landscape)').matches ? color : 'var(--bg)';
}
window.addEventListener('resize', ()=>{
  if(segments[segIndex]) applyLandscapeBg(segments[segIndex].colorHex || segments[segIndex].color);
});

function updateProgress(){
  const totalDur = segments.reduce((a,s)=>a+s.duration,0);
  const elapsed = segments.slice(0,segIndex).reduce((a,s)=>a+s.duration,0) + (segments[segIndex].duration - remaining);
  document.getElementById('progressFill').style.width = (100*elapsed/totalDur)+'%';
}

function runTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(paused) return;
    remaining -= 1;
    if(remaining <= 3 && remaining >= 1 && lastBeepSec !== remaining){
      lastBeepSec = remaining; beep(880,0.09,0.3); vibrate(30);
    }
    if(remaining <= 0){
      nextSegment();
      return;
    }
    document.getElementById('bigClock').textContent = fmt(remaining);
    updateProgress();
  }, 1000);
}
function nextSegment(){
  if(segIndex < segments.length-1){
    segIndex++;
    loadSegment(segIndex);
  } else {
    finishWorkout();
  }
}
function finishWorkout(){
  clearInterval(timerHandle);
  beep(990,0.2); setTimeout(()=>beep(1200,0.25),180);
  vibrate([100,60,100,60,200]);
  document.getElementById('doneSummary').textContent = blocks.length+' bloques completados · '+fmt(blocks.reduce((a,b)=>a+b.duration,0))+' totales';
  showScreen('done');
  document.getElementById('player').style.background = 'var(--bg)';
  document.body.style.background = 'var(--bg)';
}
function togglePause(){
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'CONTINUAR' : 'PAUSAR';
}
function skipFwd(){ nextSegment(); }
function skipBack(){
  if(segIndex>0){ segIndex--; loadSegment(segIndex); } else { loadSegment(0); }
}
function exitPlayer(){
  if(!confirm('¿Salir del temporizador?')) return;
  clearInterval(timerHandle);
  document.getElementById('player').style.background = 'var(--bg)';
  document.body.style.background = 'var(--bg)';
  showScreen('builder');
}
function backToBuilder(){ showScreen('builder'); }

let ctrlsTimeout;
function toggleLandscapeCtrls(){
  const p = document.getElementById('player');
  p.classList.add('show-ctrls');
  clearTimeout(ctrlsTimeout);
  ctrlsTimeout = setTimeout(()=>p.classList.remove('show-ctrls'), 2500);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* keep screen awake while running, if supported */
let wakeLock = null;
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible' && document.getElementById('player').classList.contains('active')){
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
});
document.getElementById('startBtn').addEventListener('click', async ()=>{
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
});
</script>
